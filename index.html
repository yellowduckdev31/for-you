<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu Wardani My Baby Honey ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    .heart {
      font-size: 60px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      background: #ff6b81;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .photo {
      width: 220px;
      border-radius: 15px;
      margin-top: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* animasi hati jatuh */
    .falling-heart {
      position: fixed;
      top: -10px;
      font-size: 20px;
      animation: fall linear infinite;
      color: red;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
      }
    }
  </style>
</head>
<body>

<!-- AUDIO -->
<audio id="bgm" loop>
  <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="heart">❤️</div>

  <h1>Halo Sayang</h1>

  <p>
    Aku mungkin bukan orang yang paling sempurna,<br>
    tapi aku selalu ingin jadi yang terbaik untuk kamu.
  </p>

  <button onclick="startExperience()">Klik ini ya 💌</button>

  <div id="message" class="hidden">
    <p>
      Terima kasih sudah ada di hidupku.<br>
      Setiap hari bersamamu itu berharga.<br><br>
      Aku sayang kamu, sekarang... besok... dan seterusnya ❤️
    </p>

    <!-- GANTI FOTO DI SINI -->
    <img src="foto.jpg" class="photo" alt="Foto kita">

    <p>
      - Dari Pangeran Kodok yang selalu mikirin kamu -
    </p>

    <button onclick="loveAlert()">Aku Sayang Kamu Cinta 💖</button>
  </div>
</div>

<script>
  function startExperience() {
    document.getElementById("message").classList.remove("hidden");

    // play musik
    const music = document.getElementById("bgm");
    music.play();

    // mulai efek hati jatuh
    startHearts();
  }

  function loveAlert() {
    alert("Aku tahu kok kamu sayang aku 😆❤️");
  }

  function startHearts() {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "falling-heart";
      heart.innerText = "❤️";

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (2 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }, 300);
  }
</script>

</body>
</html>
